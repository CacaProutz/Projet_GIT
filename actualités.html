<!DOCTYPE html> <!-- Indique que le document est en HTML5 -->
<html lang="fr"> <!-- Langue du document : français -->

<head> <!-- Contient les informations invisibles -->
  <meta charset="UTF-8"> <!-- Encodage des caractères -->
  <title>Actualités du 53e RT</title> <!-- Titre de la page -->
  <link rel="stylesheet" href="style.css"> <!-- Lien vers la feuille de style -->
</head> <!-- contient les métadonnées -->
<body> <!-- Contenu visible -->
<header> <!-- En-tête -->
  <h1>Actualités</h1>
  <nav> <!-- Menu de navigation -->
    <ul>
      <li><a href="accueil.html">Accueil</a></li> <!-- Élément d'une liste (ul ou ol) pour accès à la page d'accueil -->
        <li><a href="unité.html">Présentation de l'unité</a></li> <!-- Élément d'une liste pour accéder à la présentation de l'unité -->
        <li><a href="matérieletvéhicules.html">Matériel et véhicules</a></li> <!-- Élément d'une liste pour accéder aux informations sur le matériel et les véhicules -->
        <li><a href="carte.html">Ou est le 53e RT</a></li> <!-- Élément d'une liste pour afficher la carte -->
        <li><a href="contact.html">Contact</a></li> <!-- Élément d'une liste pour accéder à la page de contact -->
        <li><a href="actualités.html">Actualités</a></li> <!-- Élément d'une liste pour voir les actualités -->
    </ul>
  </nav> <!-- Menu de navigation -->
</header> <!-- En-tête -->
<main> <!-- Contenu principal -->
  <h2>Liste des actualités</h2>
  <div id="newsList"></div> <!-- Les actualités seront affichées ici -->
  <h2>Ajouter une actualité</h2>
  <form id="newsForm"> <!--Définit un formulaire. -->
    <input type="text" id="titre" placeholder="Titre de l'actualité">
    <textarea id="contenu" placeholder="Contenu de l'actualité" rows="4"></textarea>  <!--Zone de texte multiligne required = indique que l'utilisateur doit définir une valeur avant que le formulaire puisse être envoyé -->
    <button type="button" id="ajouter">Ajouter</button> <!--Bouton cliquable.-->
  </form> <!--Définit un formulaire. -->
</main> <!-- Contenu principal -->
<script>
// Liste des actualités
let actualites = [  // Déclaration de variables 
    { titre: "Exercices SIC", contenu: "Déploiement STC-E en multinational." },
    { titre: "OPEX Sahel", contenu: "Projection PROTERRE avec VAB T3." },
    { titre: "Sentinelle", contenu: "Soutien sécurité intérieure 2026." },
    { titre: "35 ans Lunéville", contenu: "Cérémonie commémorative." }
];
// Fonction pour afficher les actualités
function afficherActualites() { // Déclaration de fonctions 
    let liste = document.getElementById("newsList"); // Sélectionne un élément
    liste.innerHTML = ""; // Modifie le contenu, les styles ou attributs
    actualites.forEach(actu => { // Déclaration de fonctions 
        let bloc = document.createElement("div"); // Déclaration de fonctions 
        bloc.innerHTML = `<h3>${actu.titre}</h3><p>${actu.contenu}</p>`; // Modifie le contenu, les styles ou attributs
        liste.appendChild(bloc); // Ajouter un élément à la fin du body
    });
}
// Affichage au chargement de la page
afficherActualites();
// Ajouter une actualité
document.getElementById("ajouter").addEventListener("click", () => { // Sélectionne un élément + Gérer les interactions utilisateur
    let titreInput = document.getElementById("titre"); // Sélectionne un élément
    let contenuInput = document.getElementById("contenu");// Sélectionne un élément
    // Vérification des champs
    if (titreInput.value.trim() === "" || contenuInput.value.trim() === "") { // Conditions
        alert("Veuillez remplir les deux champs !");
        return;
    }
    // Ajout de l'actualité
    actualites.push({   // Manipulation de tableau
        titre: titreInput.value.trim(),  // titre:le nom du champ titreinput:c’est l’élément HTML 
                                         //.value:récupère ce que l’utilisateur a tapé .trim():enlève les espaces inutiles au début et à la fin
        contenu: contenuInput.value.trim() //contenu:nom du champ  contenuinput:la zone de texte
                                           //.value:récupère ce que l’utilisateur a écrit .trim():enlève les espaces au début et à la fin
    });
    afficherActualites();
    titreInput.value = "";  // Réinitialisation du formulaire
    contenuInput.value = ""; // Réinitialisation du formulaire
});
</script>
</body>
</html>
