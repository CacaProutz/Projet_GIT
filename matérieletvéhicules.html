</head>
<body>
  <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/53RT.gif/250px-53RT.gif"
<h1>Matériel et systèmes du 53e RT</h1>
<!-- Menu de navigation -->
<nav>
  <ul>
     <li><a href="accueil.html">Accueil</a></li> <!-- Élément d'une liste (ul ou ol) pour accès à la page d'accueil -->
        <li><a href="unité.html">Présentation de l'unité</a></li> <!-- Élément d'une liste pour accéder à la présentation de l'unité -->
        <li><a href="matérieletvéhicules.html">Matériel et véhicules</a></li> <!-- Élément d'une liste pour accéder aux informations sur le matériel et les véhicules -->
        <li><a href="carte.html">Ou est le 53e RT</a></li> <!-- Élément d'une liste pour afficher la carte -->
        <li><a href="contact.html">Contact</a></li> <!-- Élément d'une liste pour accéder à la page de contact -->
        <li><a href="actualités.html">Actualités</a></li> <!-- Élément d'une liste pour voir les actualités -->
</nav>
<!-- Tableau des matériels -->
<table border="1">
  <tr> <!--ligne du tableau -->
    <th>Nom</th> <!--cellule d’en-tête -->
    <th>Catégorie</th> 
  </tr>
  <tbody id="tableau"></tbody> <!--zone du tableau où on met les données-->
</table>
 <h2>Ajouter un véhicule ou un Matériel</h2>
  <form id="newsForm"> <!--Définit un formulaire. -->
    <input type="text" id="nom" placeholder="Nom du matériel ou du véhicule">
    <textarea id="Catégorie" placeholder="Catégorie" rows="4"></textarea>  <!--Zone de texte multiligne required = indique que l'utilisateur doit définir une valeur avant que le formulaire puisse être envoyé -->
    <button type="button" id="ajouter">Ajouter</button> <!--Bouton cliquable.-->
  </form> <!--Définit un formulaire. -->
<script>
// Liste des matériels
let materiels = [
  {nom:"VAB T3", categorie:"Véhicule"},
  {nom:"Station T2", categorie:"Communication"},
  {nom:"Chaîne hertzienne (CHF)", categorie:"Communication"},
  {nom:"PR4G", categorie:"Communication"},
  {nom:"CART", categorie:"Communication"},
  {nom:"CECORE", categorie:"Centre de commandement"},
  {nom:"PABX", categorie:"Téléphonie"}
];
// Fonction pour afficher le tableau
function afficher() {
  let tableau = document.getElementById("tableau");
  tableau.innerHTML = ""; // Vide le tableau
  // Boucle sur les matériels
  for (let i = 0; i < materiels.length; i++) {
    let ligne = document.createElement("tr");
    // Remplir la ligne
    ligne.innerHTML =
      "<td>" + materiels[i].nom + "</td>" +
      "<td>" + materiels[i].categorie + "</td>";
    // Ajouter la ligne au tableau
    tableau.appendChild(ligne);
  }
}
// Lancer l'affichage
afficher();
</script>
</body>
</html>
