<!DOCTYPE html> <!-- Document HTML5 -->
<html lang="fr">
<head>
  <meta charset="UTF-8"> <!-- Encodage -->
  <title>Matériel du 53e RT</title> <!-- Titre de la page -->
  <link rel="stylesheet" href="style.css"> <!-- Lien vers le CSS -->
</head>
<body>
<h1>Matériel et systèmes du 53e RT</h1>
<!-- Menu de navigation -->
<nav>
  <ul>
    <li><a href="accueil.html">Accueil</a></li>
    <li><a href="unité.html">Présentation de l'unité</a></li>
    <li><a href="matérieletvéhicules.html">Matériel et véhicules</a></li>
    <li><a href="carte.html">Où est le 53e RT</a></li>
    <li><a href="contact.html">Contacts</a></li>
    <li><a href="actualités.html">Actualités</a></li>
  </ul>
</nav>
<!-- Tableau des matériels -->
<table border="1">
  <tr> <!--ligne du tableau -->
    <th>Nom</th> <!--cellule d’en-tête -->
    <th>Catégorie</th> 
  </tr>
  <tbody id="tableau"></tbody> <!--zone du tableau où on met les données-->
</table>
<!-- Image affichée au survol -->
<img id="photo" src="" alt="Photo du matériel" style="display:none; width:300px;">
<script>
// Liste des matériels
let materiels = [
  {nom:"VAB T3", categorie:"Véhicule", photo:"https://i62.servimg.com/u/f62/11/14/78/36/vab_st12.jpg"},
  {nom:"Station T2", categorie:"Communication", photo:"https://lh6.googleusercontent.com/proxy/..."},
  {nom:"Chaîne hertzienne (CHF)", categorie:"Communication", photo:"https://www.opex360.com/wp-content/uploads/28ert-20170828.jpg"},
  {nom:"PR4G", categorie:"Communication", photo:"https://ezines.homecomputing.fr/fr/rafale/15/Images/06/ER315.jpg"},
  {nom:"CART", categorie:"Communication", photo:"https://www.accesradio.com/wp-content/uploads/81616-SRX2200_Radio-1-Front_Right3q.jpg"},
  {nom:"CECORE", categorie:"Centre de commandement", photo:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQQJOHiWe4P5sqIAIHLVyeKfE_q4BJMKu0qmg&s"},
  {nom:"PABX", categorie:"Téléphonie", photo:"https://www.techni-contact.com/ressources/images/produits/zoom/telephone-simple-de-pabx-siemens-5168817-1.jpg"}
];
// Fonction pour afficher le tableau
function afficher() {
  let tableau = document.getElementById("tableau");
  tableau.innerHTML = ""; // Vide le tableau
  // Boucle sur les matériels
  for (let i = 0; i < materiels.length; i++) {
    let ligne = document.createElement("tr");
    // Remplir la ligne
    ligne.innerHTML =
      "<td>" + materiels[i].nom + "</td>" +
      "<td>" + materiels[i].categorie + "</td>";
    // Quand la souris passe dessus
    ligne.addEventListener("mouseover", function() {
      let photo = document.getElementById("photo");
      photo.src = materiels[i].photo;
      photo.style.display = "block";
    });
    // Quand la souris quitte la ligne
    ligne.addEventListener("mouseout", function() {
      let photo = document.getElementById("photo");
      photo.style.display = "none";
    });
    // Ajouter la ligne au tableau
    tableau.appendChild(ligne);
  }
}
// Lancer l'affichage
afficher();
</script>
</body>
</html>
